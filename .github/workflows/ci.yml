name: CI
on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos_ci_password
          POSTGRES_DB: pos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pos:pos_ci_password@localhost:5432/pos
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pos/api exec prisma generate
      - run: pnpm --filter @pos/api exec prisma migrate deploy
      - run: pnpm --filter @pos/api seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @pos/api test:e2e
      - run: pnpm build
